<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة الجمع والطرح</title>
<style>
body{margin:0;min-height:100vh;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:system-ui}
.card{background:#fff;width:90%;max-width:380px;border-radius:24px;padding:28px;text-align:center}
input{width:100%;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:12px;font-size:18px;text-align:center}
button{padding:12px 18px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin:5px}
.plus{background:#3b82f6;color:#fff} .minus{background:#f59e0b;color:#fff}
.calc{width:100%;background:#0f172a;color:#fff;margin-top:10px}
#result{margin-top:15px;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>🧮 حاسبة الجمع والطرح</h2>
<input id="n1" type="number" placeholder="الرقم الاول">
<input id="n2" type="number" placeholder="الرقم الثاني">
<div>
<button class="plus" onclick="op='+'">+ جمع</button>
<button class="minus" onclick="op='-'">- طرح</button>
</div>
<button class="calc" onclick="calc()">احسب</button>
<div id="result"></div>
</div>
<script>
let op='+';
function calc(){
let a=parseFloat(n1.value), b=parseFloat(n2.value);
if(isNaN(a)||isNaN(b)){result.innerText='ادخل الرقمين!';return;}
result.innerText='الناتج هو: '+(op=='+'?a+b:a-b);
}
</script>
</body>
</html>
